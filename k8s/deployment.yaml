# replicas=1 is the safe default. Shared runtime state (quota, A2A tasks, approvals,
# SSE replay, signature nonces) is local by default; set AGENT_STATE_BACKEND=redis
# and point REDIS_HOST at a Redis service before scaling out. Sandbox state is
# scoped to a single turn and does not need to be shared.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-hub
  labels:
    app: agent-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-hub
  template:
    metadata:
      labels:
        app: agent-hub
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: agent-hub
          image: ghcr.io/riemannchow/agent-hub:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVER_SHUTDOWN
              value: graceful
            - name: SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE
              value: 30s
            # Production auth settings. Secrets themselves come from agent-hub-secret.
            - name: AGENT_AUTH_SMS_MODE
              value: http
            - name: AGENT_WECHAT_DEMO_CONFIRM
              value: "false"
            # Switch to `redis` before increasing replicas; requires a reachable Redis service.
            - name: AGENT_STATE_BACKEND
              value: local
            - name: REDIS_HOST
              value: redis
          envFrom:
            - secretRef:
                name: agent-hub-secret
                optional: true
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
