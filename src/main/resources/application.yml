spring:
  application:
    name: agent-hub
  profiles:
    active: seekdb
  # ============ Nacos 服务注册 / 发现（A2A 智能体服务发现） ============
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        enabled: true
        # 注册到 Nacos 的元数据：对端智能体据此找到本实例的 A2A 端点与 Agent Card
        metadata:
          a2a-endpoint: ${AGENT_PUBLIC_URL:http://localhost:8080}/a2a
          a2a-card: ${AGENT_PUBLIC_URL:http://localhost:8080}/.well-known/agent.json
          version: "1.0.0"

# ============ SeekDB / OceanBase（兼容 MySQL 协议） ============
---
spring:
  config:
    activate:
      on-profile: seekdb
  autoconfigure:
    exclude:
      # 仅排除同步 Mongo 自动配置；响应式 Mongo 用于存放登录/用户数据
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
  data:
    mongodb:
      uri: mongodb://127.0.0.1:27017/agent_hub
      auto-index-creation: false   # 不在启动时强制连库建索引，避免无 Mongo 时启动失败
  datasource:
    url: jdbc:oceanbase://127.0.0.1:2881/demo
    username: root
    password: ${SEEKDB_PASSWORD:}   # 默认空密码；生产环境通过环境变量注入
    driver-class-name: com.oceanbase.jdbc.Driver
    hikari:
      initialization-fail-timeout: 0   # 连不上库也不中断启动；首次真正使用 DataSource 时才失败
  jdbc:
    template:
      fetch-size: 100
  sql:
    init:
      mode: never                       # 不在启动时跑 schema.sql，避免初始化器强依赖一个活的 DataSource

# ============ MongoDB（备选 Repository 实现） ============
# 切换到 mongo 时排除 JDBC 自动配置，避免缺少 DataSource 导致启动失败。
---
spring:
  config:
    activate:
      on-profile: mongo
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  data:
    mongodb:
      uri: mongodb://127.0.0.1:27017/demo

---
# ============ Agent Persona（切换行业只需改这里） ============
# 该文档不带 on-profile，对所有 profile 均生效（seekdb / mongo 都能读到 agent.*）
agent:
  persona:
    role-name: "电商数据分析助手"
    domain-description: "你服务于电商行业，擅长对用户行为、GMV、转化率进行问数分析，数据存储在 SeekDB 中。"
    output-format: "以 Markdown 表格返回指标，并附一句话结论。"
  # ============ 模型配置（腾讯混元 Hunyuan，经 LKEAP 的 Anthropic 兼容网关） ============
  # 网关即 Anthropic Messages 协议：ANTHROPIC_BASE_URL + ANTHROPIC_AUTH_TOKEN
  # 安全：api-key 一律从环境变量注入，仓库内不保留任何明文密钥；
  #       生产部署请务必设置 AGENT_MODEL_API_KEY，否则模型调用会鉴权失败。
  model:
    provider: hy4
    api-key: ${AGENT_MODEL_API_KEY:}
    base-url: ${AGENT_MODEL_BASE_URL:https://api.lkeap.cloud.tencent.com/plan/anthropic}
    name: ${AGENT_MODEL_NAME:hy4-preview}
    # 可选兜底模型：主模型重试耗尽后仍失败时切到它继续本轮。
    # 留空 name 即不启用；base-url / api-key 留空则复用主模型的网关与凭据。
    fallback:
      name: ${AGENT_FALLBACK_MODEL_NAME:}
      base-url: ${AGENT_FALLBACK_BASE_URL:}
      api-key: ${AGENT_FALLBACK_API_KEY:}
  # ============ 执行层：超时 / 重试 / 整轮上限 ============
  # AgentScope 自带默认值（模型 5 分钟 / 3 次、工具 5 分钟 / 1 次），偏宽且不可运营，
  # 这里显式下发：模型单次超时可重试、工具默认不重试（避免副作用重复执行）、
  # turn-timeout 兜住整轮总时长，保证前端 SSE 一定能收到终止信号。
  execution:
    turn-timeout: ${AGENT_TURN_TIMEOUT:300s}
    model:
      timeout: ${AGENT_MODEL_TIMEOUT:120s}
      max-attempts: ${AGENT_MODEL_MAX_ATTEMPTS:3}
      initial-backoff: 500ms
      max-backoff: 5s
      backoff-multiplier: 2.0
    tool:
      timeout: ${AGENT_TOOL_TIMEOUT:30s}
      max-attempts: ${AGENT_TOOL_MAX_ATTEMPTS:1}
  # ============ SQL 守卫：LLM 生成的 SQL 下发前必须过的静态校验 ============
  # 只放行「单条 SELECT + 白名单表 + 无危险函数」，并强制在外层包一层 LIMIT。
  # 白名单刻意不含 conversation / message / memory —— 这些表存放其他用户的会话与隐私。
  sql-guard:
    enabled: ${AGENT_SQL_GUARD_ENABLED:true}
    allowed-tables:
      - products
      - users
      - orders
      - book_info
    max-rows: ${AGENT_SQL_MAX_ROWS:200}
    query-timeout-seconds: ${AGENT_SQL_QUERY_TIMEOUT_SECONDS:10}
    max-length: 4000
  # ============ 上下文窗口 / 历史摘要 ============
  # 替代原先写死的 MAX_HISTORY=8 硬截断：窗口按「条数 + 字符预算」双重约束，
  # 被挤出窗口的老历史走滚动摘要（带缓存、失败自动降级为「仅最近窗口」）。
  # 详见 ContextWindowAssembler 的类注释。
  context:
    summarize-enabled: ${AGENT_CONTEXT_SUMMARIZE_ENABLED:true}
    # 原样注入模型的最近历史条数（不含本轮用户消息）
    recent-messages: ${AGENT_CONTEXT_RECENT_MESSAGES:8}
    # 最近窗口的字符预算：防止一条超长消息（长表格/长贴文）挤爆上下文
    recent-char-budget: ${AGENT_CONTEXT_RECENT_CHAR_BUDGET:6000}
    # 溢出不足这么多条时直接丢弃，不值得为几条历史花一次模型调用
    summary-trigger-messages: 4
    # 距上次摘要新增不足这么多条时复用旧摘要，避免每轮都摘要
    summary-min-new-messages: 4
    summary-max-chars: 1200
    summary-timeout: 20s
    summary-cache-size: 512
  # ============ 限流与配额（每用户） ============
  # 并发名额：同一用户同时在跑的轮次上限，防止「开十个标签页把网关打到限流」。
  # 每日 token：当日累计用量超限后直接拒绝新请求（自然日 0 点重置）。
  # 注意：计数在进程内，多实例部署需换成 Redis 计数器（接口不变）。
  quota:
    enabled: ${AGENT_QUOTA_ENABLED:true}
    max-concurrent-turns-per-user: ${AGENT_QUOTA_MAX_CONCURRENT:2}
    daily-token-limit: ${AGENT_QUOTA_DAILY_TOKENS:500000}
  # ============ 图书混合检索（Java 版） ============
  books:
    # 数据集文件名（sql/ 目录或 classpath 均可），对应 Kaggle: Amazon Top 50 Bestselling Books 2009-2019
    csv-path: sql/bestsellers_with_categories.csv
  # ============ A2A（Agent-to-Agent）协议对外暴露的配置 ============
  a2a:
    # 本智能体对外可访问的基础地址（注册到 Nacos、写进 Agent Card 的 url 用）；
    # 容器/多实例部署时改为宿主 IP 或网关地址。
    public-url: ${AGENT_PUBLIC_URL:http://localhost:8080}
    version: "1.0.0"

# ============ 可观测性：Actuator + Micrometer（指标 / 健康检查） ============
# Langfuse 回答「这一次调用为什么慢」；Micrometer 回答「今天 P99 多少、工具失败率多少、
# 一共烧了多少 token」。两者互补，缺一不可。
#
#   GET /actuator/health              整体健康
#   GET /actuator/health/liveness     K8s livenessProbe
#   GET /actuator/health/readiness    K8s readinessProbe
#   GET /actuator/prometheus          Prometheus 抓取端点
#
# 自定义指标：agent.turns / agent.turn.duration(p50/p95/p99) / agent.turns.active
#            agent.model.calls / agent.tokens / agent.tool.calls
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      # 探针分组刻意只包含「应用自身状态」，不挂 DB/Mongo indicator：
      # 本项目设计上允许无库启动（侧边栏降级为空），把 DB 挂进 readiness 会让 Pod 一直 NotReady。
      # 需要把依赖也纳入就绪判断时，把 jdbc / mongo 加进 include 即可。
      group:
        readiness:
          include: readinessState,ping
        liveness:
          include: livenessState,ping
      show-details: never
  metrics:
    tags:
      application: agent-hub
    distribution:
      # 直方图便于跨实例聚合出准确的 P99（单实例的 percentile 无法相加）
      percentiles-histogram:
        agent.turn.duration: true

# ============ 可观测性：Langfuse（OpenTelemetry OTLP） ============
# 开启后：AgentScope 的 agent / 模型调用 / 工具调用会以 OTel span 上报 Langfuse，
#         在 Langfuse 中呈现为「一条 trace = 一轮对话」，可按 session、user 聚合。
# 关闭（默认）时容器里不会装配任何 tracing 中间件，零额外开销。
# 凭据获取：Langfuse 项目 Settings → API Keys（public key 以 pk-lf- 开头，secret key 以 sk-lf- 开头）。
langfuse:
  enabled: ${LANGFUSE_ENABLED:false}
  public-key: ${LANGFUSE_PUBLIC_KEY:}
  secret-key: ${LANGFUSE_SECRET_KEY:}
  # 云端 EU：https://cloud.langfuse.com   US：https://us.cloud.langfuse.com   自托管：http://localhost:3000
  host: ${LANGFUSE_HOST:https://cloud.langfuse.com}
  # 留空则由 host 推导出 {host}/api/public/otel/v1/traces；需要走网关/Collector 时在此写完整地址
  endpoint: ${LANGFUSE_OTEL_ENDPOINT:}
  environment: ${LANGFUSE_ENVIRONMENT:local}
  release: ${LANGFUSE_RELEASE:1.0.0}
  service-name: agent-hub
  # 是否上报 prompt / completion / 工具入参出参；含敏感数据的生产环境建议置为 false
  capture-content: ${LANGFUSE_CAPTURE_CONTENT:true}
  # 单条 input/output 的最大字符数，超出截断
  max-payload-chars: 4000
  export-timeout-millis: 10000
  max-queue-size: 2048

# ============ OceanBase 知识图谱问答（Neo4j 后端） ============
---
spring:
  config:
    activate:
      on-profile: oceanbase
  # oceanbase profile 下不需要 SeekDB 的 JDBC/Mongo 数据源，排除避免无配置启动失败
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  data:
    mongodb:
      # oceanbase profile 复用 MongoDB 承载登录态/会话票据（AuthService 依赖），
      # 不依赖 SeekDB；Neo4j 仅用于知识图谱检索。
      uri: mongodb://127.0.0.1:27017/agent_hub
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    user: ${NEO4J_USER:neo4j}
    password: ${NEO4J_PASSWORD:oceanbase123}   # 默认本地演示密码；生产请通过环境变量覆盖

# OceanBase 专属人格（覆盖全局 agent.persona.*）
agent:
  persona:
    role-name: "OceanBase 技术助手"
    domain-description: "你精通 OceanBase 分布式数据库（部署拓扑、租户/资源池、SQL、运维与排障），知识来源于 Neo4j 知识图谱（官方文档 + 主仓库代码 + 社区文档）。回答前优先调用 ob_* 工具检索图谱，再综合作答。"
    output-format: "先给结论，再给依据（引用图谱中的实体/关系），必要时附 Cypher 或命令示例。"
