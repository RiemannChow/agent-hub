name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

# 同一分支只保留最新一次运行，节省资源
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ===== 门禁 1：编译 + 测试 + 静态分析（Checkstyle / Spotless / SpotBugs） =====
  build:
    name: Build & Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # fetch-depth: 0 是 Spotless ratchetFrom=main 的必要条件，
          # 否则无法对比 main 分支、ratchet 失效。
          fetch-depth: 0

      # PR 触发时 checkout 的是 detached HEAD（refs/pull/N/merge），本地并没有名为 main 的引用，
      # 而 pom.xml 里 spotless 的 ratchetFrom=main 需要本地 main 才能计算变动文件，
      # 否则 spotless:check 直接报 "No such reference 'main'"，所有 PR 门禁都会失败。
      - name: Ensure local main ref for Spotless ratchet
        run: |
          git fetch origin main:refs/remotes/origin/main
          if ! git show-ref --verify --quiet refs/heads/main; then
            git branch main origin/main
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile, test & quality gates
        # verify 阶段会依次触发：compile → test → spotless:check → checkstyle:check → spotbugs:check → package
        # 使用系统 Maven（runner 自带），不依赖仓库里的 Maven Wrapper。
        run: mvn -B -ntp verify

      # 失败时归档静态分析 / 测试报告，便于在 PR 页面直接查看原因
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          retention-days: 7
          if-no-files-found: ignore
          path: |
            target/checkstyle-result.xml
            target/spotbugsXml.xml
            target/site/spotbugs.html
            target/surefire-reports/**

      # 覆盖率报告始终归档，便于在 PR 页面查看趋势
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          retention-days: 7
          if-no-files-found: ignore
          path: target/site/jacoco/**

  # ===== 门禁 2：依赖漏洞扫描（OSV-Scanner，无需 API Key，基于 OSV 数据库） =====
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install OSV-Scanner
        run: curl -sSL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64 && chmod +x osv-scanner

      - name: OSV-Scanner scan
        # The scanner exits non-zero whenever it finds ANY vulnerability (147 known IDs when
        # this gate was enabled). Keep the report so the artifact is always uploaded, then let
        # the baseline gate below decide pass/fail: known debt does not break the build, but
        # any NEW advisory blocks the merge (issue #23).
        run: |
          ./osv-scanner --recursive --format json --output-file osv-report.json ./ || true

      - name: Test the OSV baseline gate
        run: python3 .github/scripts/test_check_osv_baseline.py

      - name: Fail on new vulnerabilities
        run: python3 .github/scripts/check_osv_baseline.py osv-report.json .github/osv-baseline.txt

      - name: Upload OSV report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osv-dependency-report
          retention-days: 7
          if-no-files-found: ignore
          path: osv-report.json
