name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

# 同一分支只保留最新一次运行，节省资源
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ===== 门禁 1：编译 + 测试 + 静态分析（Checkstyle / Spotless / SpotBugs） =====
  build:
    name: Build & Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 是 Spotless ratchetFrom=main 的必要条件，
          # 否则无法对比 main 分支、ratchet 失效。
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile, test & quality gates
        # verify 阶段会依次触发：compile → test → spotless:check → checkstyle:check → spotbugs:check → package
        # 使用系统 Maven（runner 自带），不依赖仓库里的 Maven Wrapper。
        run: mvn -B -ntp verify

      # 失败时归档静态分析 / 测试报告，便于在 PR 页面直接查看原因
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          retention-days: 7
          if-no-files-found: ignore
          path: |
            target/checkstyle-result.xml
            target/spotbugsXml.xml
            target/site/spotbugs.html
            target/surefire-reports/**

  # ===== 门禁 2：依赖漏洞扫描（OSV-Scanner，无需 API Key，基于 OSV 数据库） =====
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OSV-Scanner
        run: curl -sSL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64 && chmod +x osv-scanner

      - name: OSV-Scanner scan
        # 递归扫描 pom.xml 等锁文件；发现已知漏洞时以非 0 退出，阻断合并。
        # 如需忽略特定已知项，在仓库根添加 osv-scanner.toml 配置 ignore。
        run: ./osv-scanner --recursive --skip-git ./
